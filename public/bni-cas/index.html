<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>BNI CAS Power Team</title>
<style>
  :root{
    --brand:#0b5d3b; --brand2:#0f7a4d; --brand-ink:#0a3d28;
    --bni:#cf2030; --cas1:#6a2bd9; --cas2:#e0457b;
    --bg:#ffffff; --bg2:#f4f6f5; --line:#e6e9e8;
    --ink:#1b1f1d; --ink2:#5e6763; --chip:#ffffff; --shadow:0 2px 10px rgba(0,0,0,.08);
    --frame:#d9dedc;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121614; --bg2:#1a201d; --line:#26302b; --ink:#eef2f0; --ink2:#9aa6a0;
      --chip:#1d2420; --shadow:0 2px 10px rgba(0,0,0,.4); --frame:#0b0e0c;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121614; --bg2:#1a201d; --line:#26302b; --ink:#eef2f0; --ink2:#9aa6a0;
    --chip:#1d2420; --shadow:0 2px 10px rgba(0,0,0,.4); --frame:#0b0e0c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--frame);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);display:flex;justify-content:center}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  img{display:block}

  /* Phone shell: full screen on mobile, framed on desktop */
  .phone{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
  @media (min-width:600px){
    body{align-items:center;padding:24px 0}
    .phone{height:min(900px,calc(100vh - 48px));border-radius:36px;box-shadow:0 20px 60px rgba(0,0,0,.35);border:10px solid #111}
  }

  /* Header */
  header{background:linear-gradient(180deg,var(--brand-ink),var(--brand));color:#fff;padding:10px 16px 18px;flex:none}
  .status{display:flex;justify-content:space-between;font-size:13px;font-weight:600;opacity:.95;margin-bottom:12px}
  .head-row{display:flex;gap:10px;align-items:center}
  .search{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:11px 14px;color:#555}
  .search input{border:0;outline:0;flex:1;font-size:16px;background:transparent;color:#222;min-width:0}
  .badge{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
  .badge.bni{background:var(--bni);color:#fff;font-size:12px;letter-spacing:.5px}
  .badge.me{background:#e8f5ee;color:var(--brand);font-size:18px}

  main{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:16px}
  main::-webkit-scrollbar{display:none}

  /* Service grid */
  .grid-wrap{overflow-x:auto;scroll-snap-type:x mandatory;display:flex;scrollbar-width:none;padding-top:16px}
  .grid-wrap::-webkit-scrollbar{display:none}
  .grid-page{flex:0 0 100%;scroll-snap-align:start;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:min-content;row-gap:14px;padding:0 8px}
  .svc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 2px;border-radius:14px}
  .svc:active{background:var(--bg2)}
  .svc .ic{width:62px;height:62px;display:grid;place-items:center;font-size:42px;line-height:1;position:relative}
  .svc .lbl{font-size:12.5px;color:var(--ink);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:86px}
  .svc .tag{position:absolute;top:-2px;right:-8px;background:var(--bni);color:#fff;font-size:9px;font-weight:700;padding:2px 5px;border-radius:8px}
  .dots{display:flex;justify-content:center;gap:5px;margin:10px 0 4px}
  .dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:.2s}
  .dots i.on{width:18px;background:var(--ink)}

  /* Quick cards */
  .quick{display:flex;gap:10px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
  .quick::-webkit-scrollbar{display:none}
  .qcard{flex:0 0 150px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;background:var(--chip);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .qcard small{display:block;color:var(--ink2);font-size:12px}
  .qcard b{font-size:16px}
  .qcard span.e{font-size:24px}

  h2{font-size:22px;margin:22px 16px 12px;display:flex;align-items:center;gap:10px}
  h2 .arrow{width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:14px;color:var(--ink2)}

  /* Featured banner (cover slide) */
  .hero{display:block;margin:0 16px;width:calc(100% - 32px);border-radius:18px;overflow:hidden;position:relative;box-shadow:var(--shadow);background:#fff}
  .hero img{width:100%;height:auto}
  .hero .cta{position:absolute;left:12px;bottom:12px;background:linear-gradient(90deg,var(--cas1),var(--cas2));color:#fff;font-weight:800;padding:8px 16px;border-radius:20px;font-size:14px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
  .hero-cap{margin:10px 16px 0;font-size:16px}
  .hero-cap small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}

  /* Category chips */
  .cats{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cats button{flex:none;padding:7px 14px;border-radius:18px;border:1px solid var(--line);font-size:14px;background:var(--chip);white-space:nowrap}
  .cats button.on{background:var(--brand2);border-color:var(--brand2);color:#fff}

  /* Member list */
  .list{padding:0 16px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:16px;background:var(--chip);text-align:left;width:100%}
  .logo-box{width:84px;height:52px;border-radius:10px;background:#fff;border:1px solid #eee;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;padding:4px}
  .logo-box img{max-width:100%;max-height:100%;min-width:0;min-height:0;object-fit:contain}
  .logo-box .em{font-size:28px}
  .row .tx{flex:1;min-width:0}
  .row b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row small{display:block;color:var(--ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .go{color:var(--ink2);font-size:20px}
  .empty{padding:30px 16px;text-align:center;color:var(--ink2)}

  /* Floating pill */
  .pill{position:absolute;left:50%;transform:translateX(-50%);bottom:86px;background:var(--brand-ink);color:#fff;padding:10px 20px;border-radius:24px;font-weight:600;font-size:15px;box-shadow:0 6px 16px rgba(0,0,0,.25);transition:opacity .25s;white-space:nowrap;pointer-events:none}
  .pill.hide{opacity:0}

  /* Bottom nav */
  nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--bg);padding:6px 0 calc(8px + env(safe-area-inset-bottom));align-items:end}
  nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--ink2);position:relative}
  nav button .e{font-size:22px;filter:grayscale(1);opacity:.75}
  nav button.on{color:var(--brand2)}
  nav button.on .e{filter:none;opacity:1}
  nav .center{width:62px;height:62px;border-radius:50%;background:var(--brand-ink);color:#fff;display:grid;place-items:center;font-size:26px;margin:-26px auto 0;box-shadow:0 4px 12px rgba(0,0,0,.25)}
  nav .dot{position:absolute;top:-2px;right:calc(50% - 18px);background:var(--bni);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}

  /* Slide viewer */
  .viewer{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  .viewer.open{transform:none}
  .vbar{display:flex;align-items:center;gap:10px;padding:12px 12px 10px;border-bottom:1px solid var(--line)}
  .vbar .x{width:38px;height:38px;border-radius:50%;background:var(--bg2);font-size:18px;display:grid;place-items:center;flex:none}
  .vbar .ttl{flex:1;min-width:0}
  .vbar .ttl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vbar .ttl small{display:block;color:var(--ink2);font-size:12px}
  .vbar .cnt{color:var(--ink2);font-size:13px;flex:none}
  .vbody{flex:1;overflow-y:auto;padding:16px}
  .slide{position:relative;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);background:#fff;width:100%}
  .slide img{width:100%;height:auto}
  .slide .zoom{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:5px 10px;border-radius:14px}
  .vhead{display:flex;gap:12px;align-items:center;margin-top:16px}
  .vhead .logo-box{width:96px;height:58px}
  .vhead h3{margin:0;font-size:19px;line-height:1.2}
  .vhead p{margin:2px 0 0;color:var(--ink2);font-size:14px}
  .sec{margin-top:18px}
  .sec h4{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ink2);margin:0 0 8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips span,.chips button{background:var(--bg2);border:1px solid var(--line);padding:6px 12px;border-radius:16px;font-size:14px}
  .clist{display:flex;flex-direction:column;gap:8px}
  .crow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
  .crow .ci{font-size:18px;flex:none}
  .crow .cv{flex:1 1 150px;min-width:0;font-size:15px;word-break:break-all;user-select:text;-webkit-user-select:text}
  .crow .cb{display:flex;gap:6px;flex-wrap:wrap}
  .crow .cb a,.crow .cb button{padding:7px 12px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap}
  .crow .cb a.go2{background:var(--brand2);border-color:var(--brand2);color:#fff}
  .crow .cb :focus-visible{outline:2px solid var(--brand2);outline-offset:2px}
  .vfoot{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .vfoot button,.vfoot a{flex:1;padding:13px;border-radius:24px;font-weight:700;text-align:center;font-size:15px;text-decoration:none}
  .vfoot .nav-btn{background:var(--bg2);color:var(--ink);flex:0 0 52px;font-size:20px}
  .vfoot .pri{background:var(--brand2);color:#fff}

  /* Full-screen slide (rotates to landscape on portrait phones) */
  .lightbox{position:fixed;inset:0;background:#000;z-index:50;display:none;align-items:center;justify-content:center}
  .lightbox.open{display:flex}
  .lightbox img{max-width:100vw;max-height:100vh;object-fit:contain}
  @media (orientation:portrait){
    .lightbox img{max-width:100vh;max-height:100vw;transform:rotate(90deg)}
  }
  .lightbox .hint{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;color:#fff;background:rgba(255,255,255,.15);padding:8px 14px;border-radius:18px;font-size:14px}

  .toast{position:absolute;left:16px;right:16px;bottom:96px;background:#222;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:30;text-align:center}
  .toast.on{opacity:1;transform:none}
</style>
</head>

</div>

  { id:"nestmanila", label:"Tech Gifts", icon:"🛍️", cat:"gifts", business:"The Nest Manila", title:"Corporate Gifts, Rewards & Giveaways", slide:34,
    services:["Tech gadgets","Last-minute gifts","Rewards & incentives","Giveaways"],
    email:"thenestmanila@gmail.com", phone:"+63 917 310 3221", web:"" },
  { id:"joelle", label:"Voice Over", icon:"🎧", cat:"content", business:"Joelle Villafranca", title:"Voice Actor / Voice Over Talent", slide:35,
    services:["Commercial","Corporate","Live event VO","Character"],
    email:"joellevillafranca@gmail.com", phone:"+63 998 971 5434", web:"joellevillafranca.com" },
  { id:"dolcefrutta", label:"Fruit Gifts", icon:"🍇", cat:"gifts", business:"Dolce Frutta", title:"Healthy Giveaways", slide:36,
    services:["Fruit gift boxes","Same-day delivery","Personalized packages","BIR-registered invoice"],
    email:"kristinelim@outlook.ph", phone:"+63 997 559 0927", web:"dolcefruttamnl.com" },
];
// Members whose slide has no separate logo graphic
const NO_LOGO = new Set(["cbb","risingdesigns","joelle"]);
/* ========================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const logoHTML = m => NO_LOGO.has(m.id)
  ? `<span class="em" aria-hidden="true">${m.icon}</span>`
  : `<img src="logos/${m.id}.png" alt="${esc(m.business)} logo" loading="lazy">`;
const catName = id => (CATS.find(c => c.id === id) || {}).name || "";

let query = "", cat = "all", shown = MEMBERS.slice();

function filter(){
  const q = query.toLowerCase();
  shown = MEMBERS.filter(m => (cat === "all" || m.cat === cat) &&
    (!q || [m.label,m.business,m.title,m.person,catName(m.cat),...m.services].join(" ").toLowerCase().includes(q)));
  $("#listTitle").textContent = query ? `Results for “${query}”` : "All members";
  render();
}
function renderGrid(){
  const per = 8, pages = Math.max(1, Math.ceil(shown.length / per));
  let html = "";
  for(let p=0;p<pages;p++){
    html += `<div class="grid-page">` + shown.slice(p*per,(p+1)*per).map(m =>
      `<button class="svc" data-id="${m.id}" aria-label="${esc(m.business)} — ${esc(m.title)}"><span class="ic" aria-hidden="true">${m.icon}${m.id==="printamplified"?'<span class="tag">HOST</span>':""}</span><span class="lbl">${esc(m.label)}</span></button>`
    ).join("") + `</div>`;
  }
  $("#grid").innerHTML = shown.length ? html : "";
  $("#grid").scrollLeft = 0;
  $("#dots").innerHTML = pages > 1 ? Array.from({length:pages},(_,i)=>`<i class="${i?"":"on"}"></i>`).join("") : "";
}
function renderList(){
  $("#list").innerHTML = shown.length ? shown.map(m =>
    `<button class="row" data-id="${m.id}">
      <span class="logo-box">${logoHTML(m)}</span>
      <span class="tx"><b>${esc(m.business)}</b><small>${m.icon} ${esc(m.title)}</small></span>
      <span class="go">›</span></button>`
  ).join("") : `<div class="empty">No member matches that search.<br>Try “print”, “video” or “events”.</div>`;
}
function renderCats(){
  $("#cats").innerHTML = CATS.map(c => `<button data-cat="${c.id}" class="${c.id===cat?"on":""}">${esc(c.name)}</button>`).join("");
}
function render(){ renderGrid(); renderList(); renderCats(); }

$("#grid").addEventListener("scroll", e => {
  const i = Math.round(e.target.scrollLeft / e.target.clientWidth);
  document.querySelectorAll("#dots i").forEach((d,k)=>d.classList.toggle("on",k===i));
});
$("#q").addEventListener("input", e => { query = e.target.value.trim(); filter(); });
$("#memberCount").textContent = `${MEMBERS.length} members`;

/* ---- Slide viewer ---- */
let cur = 0; // -1 = team overview
const webURL = w => /^https?:/i.test(w) ? w : "https://" + w;
// Philippine number in international form for wa.me links: "0917 …" / "+63 917 …" → "63917…"
const intlNumber = p => { const d = p.replace(/\D/g,""); return d.startsWith("0") ? "63" + d.slice(1) : d; };
// One contact line: the value as selectable text, link buttons, and a Copy button.
// https links (WhatsApp, Gmail, website) work for every viewer of a shared page;
// tel:/mailto: may do nothing for some viewers, so Copy is always offered.
function contactRow(icon, value, links){
  const btns = links.map(([href,label,web]) =>
    `<a href="${esc(href)}"${web?' class="go2" target="_blank" rel="noopener"':""}>${esc(label)}</a>`).join("");
  return `<div class="crow"><span class="ci" aria-hidden="true">${icon}</span><span class="cv">${esc(value)}</span>
    <div class="cb">${btns}<button type="button" data-copy="${esc(value)}">Copy</button></div></div>`;
}
async function copyText(btn){
  const text = btn.dataset.copy;
  try { await navigator.clipboard.writeText(text); toast(`Copied ${text}`); }
  catch {
    const el = btn.closest(".crow").querySelector(".cv");
    const r = document.createRange(); r.selectNodeContents(el);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    toast("Selected — long-press to copy");
  }
}

function openViewer(idx){ cur = idx; drawSlide(); $("#viewer").classList.add("open"); $("#vClose").focus({preventScroll:true}); }
function closeViewer(){ $("#viewer").classList.remove("open"); }
function drawSlide(){
  $("#vDeck").href = `${DECK_URL}/present`;
  if (cur < 0){
    $("#vTitle").textContent = "Creative & Advertising Services";
    $("#vSub").textContent = "BNI Power Team";
    $("#vCount").textContent = "Overview";
    $("#vBody").innerHTML = `
      <button class="slide" data-zoom="slides/cover.jpg"><img src="slides/cover.jpg" alt="Power Team cover slide"><span class="zoom">⤢ Full screen</span></button>
      <div class="sec"><h4>Who we are</h4><p style="margin:0;line-height:1.5">${MEMBERS.length} trusted specialists covering everything a brand needs — strategy, digital, content, events, print and gifts. Refer one of us and your contact gets the whole team.</p></div>
      ${CATS.filter(c=>c.id!=="all").map(c => `<div class="sec"><h4>${esc(c.name)}</h4><div class="chips">${
        MEMBERS.map((m,i)=>[m,i]).filter(([m])=>m.cat===c.id).map(([m,i])=>`<button data-jump="${i}">${m.icon} ${esc(m.business)}</button>`).join("")}</div></div>`).join("")}`;
    $("#vBody").scrollTop = 0;
    return;
  }
  const m = MEMBERS[cur];
  $("#vTitle").textContent = m.business;
  $("#vSub").textContent = m.title;
  $("#vCount").textContent = `${cur+1} / ${MEMBERS.length}`;
  const src = `slides/${m.id}.jpg`;
  const tel = m.phone.replace(/[^\d+]/g,"");
  $("#vBody").innerHTML = `
    <button class="slide" data-zoom="${src}"><img src="${src}" alt="${esc(m.business)} slide"><span class="zoom">⤢ Full screen</span></button>
    <div class="vhead">
      <span class="logo-box">${logoHTML(m)}</span>
      <div><h3>${esc(m.business)}</h3><p>${esc(m.person || m.title)}${m.slide?` · Slide ${m.slide}`:""}</p></div>
    </div>
    <div class="sec"><h4>Services</h4><div class="chips">${m.services.map(s=>`<span>${esc(s)}</span>`).join("")}</div></div>
    <div class="sec"><h4>Contact</h4>
      <div class="clist">
        ${contactRow("📞", m.phone, [[`https://wa.me/${intlNumber(m.phone)}`,"WhatsApp",true],[`tel:${tel}`,"Call"]])}
        ${contactRow("✉️", m.email, [[`https://mail.google.com/mail/?view=cm&to=${encodeURIComponent(m.email)}`,"Gmail",true],[`mailto:${m.email}`,"Email"]])}
        ${m.web ? contactRow("🌐", m.web, [[webURL(m.web),"Visit",true]]) : ""}
      </div>
    </div>`;
  $("#vBody").scrollTop = 0;
}
function step(d){ const n = MEMBERS.length; cur = cur < 0 ? (d>0?0:n-1) : (cur + d + n) % n; drawSlide(); }

function openLightbox(src){ $("#lbImg").src = src; $("#lightbox").classList.add("open"); }
$("#lightbox").addEventListener("click", () => $("#lightbox").classList.remove("open"));

document.addEventListener("click", e => {
  const t = e.target.closest("[data-copy],[data-id],[data-jump],[data-act],[data-nav],[data-cat],[data-zoom]");
  if (!t) return;
  if (t.dataset.copy) copyText(t);
  else if (t.dataset.zoom) openLightbox(t.dataset.zoom);
  else if (t.dataset.id) openViewer(MEMBERS.findIndex(m=>m.id===t.dataset.id));
  else if (t.dataset.jump) { cur = +t.dataset.jump; drawSlide(); }
  else if (t.dataset.cat) { cat = t.dataset.cat; filter(); }
  else if (t.dataset.act === "team") openViewer(-1);
  else if (t.dataset.act) toast(t.dataset.act==="refer" ? "Thank you! Tell us who you know — Givers Gain® 🙌" : "Let's meet for a 1-2-1 after the chapter meeting ☕");
  else if (t.dataset.nav) {
    if (t.dataset.nav !== "scan") document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b===t));
    if (t.dataset.nav==="home") $("#main").scrollTo({top:0,behavior:"smooth"});
    else if (t.dataset.nav==="scan") openViewer(0);
    else if (t.dataset.nav==="msgs") { $("#main").scrollTo({top:$("#listTitle").offsetTop-10,behavior:"smooth"}); }
    else toast({wins:"Team wins & testimonials — coming soon",refs:"Referrals passed within the Power Team — coming soon"}[t.dataset.nav]);
  }
});
$("#hero").addEventListener("click", () => openViewer(-1));
$("#bniBtn").addEventListener("click", () => openViewer(-1));
$("#vClose").addEventListener("click", closeViewer);
$("#vPrev").addEventListener("click", () => step(-1));
$("#vNext").addEventListener("click", () => step(1));
document.addEventListener("keydown", e => {
  if ($("#lightbox").classList.contains("open")) {
    if (e.key==="Escape") $("#lightbox").classList.remove("open");
    return;
  }
  if (!$("#viewer").classList.contains("open")) return;
  if (e.key==="Escape") closeViewer();
  if (e.key==="ArrowRight") step(1);
  if (e.key==="ArrowLeft") step(-1);
});
// Swipe between slides
let sx=null, sy=null;
$("#vBody").addEventListener("touchstart", e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
$("#vBody").addEventListener("touchend", e=>{
  if(sx==null) return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) step(dx<0?1:-1);
  sx=sy=null;
});

// "Scroll for more" pill
$("#main").addEventListener("scroll", e => $("#pill").classList.toggle("hide", e.target.scrollTop > 40));

// Theme toggle
$("#themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
});

let tt; function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("on"),2200); }

function tick(){ const d=new Date(); $("#clock").textContent=d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}).replace(/\s?[AP]M/i,""); }
tick(); setInterval(tick, 30000);
render();
</script>
</body>
</html>
