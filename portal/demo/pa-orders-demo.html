<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PA Orders Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app frame = top bar (demo role switcher) + sidebar on desktop / bottom tabs on phones, matching the real app. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --muted: #eef1f4; --border: #dde3e9; --fg: #0f1b2d; --fg-2: #536173;
  --primary: #007c89; --primary-soft: #e3f4f6; --accent: #c81e4e; --nav: #0f1b2d; --nav-fg: #c9d4e0;
  --ok: #157a46; --ok-soft: #e4f5ec; --warn: #a15c00; --warn-soft: #fdf1df; --bad: #c0262d; --bad-soft: #fdebec; --info: #2459b8; --info-soft: #e7eefb;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1420; --surface: #132033; --muted: #1a2a40; --border: #26384f; --fg: #e8eef5; --fg-2: #9fb0c3;
  --primary: #2bb3c2; --primary-soft: #0f3640; --accent: #f0587f; --nav: #08101a; --nav-fg: #a9b8c8;
  --ok: #4fcf8a; --ok-soft: #12301f; --warn: #f0ad4e; --warn-soft: #3a2a10; --bad: #ff7a7f; --bad-soft: #3d1517; --info: #7fa8ff; --info-soft: #18264a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c1420; --surface: #132033; --muted: #1a2a40; --border: #26384f; --fg: #e8eef5; --fg-2: #9fb0c3;
  --primary: #2bb3c2; --primary-soft: #0f3640; --accent: #f0587f; --nav: #08101a; --nav-fg: #a9b8c8;
  --ok: #4fcf8a; --ok-soft: #12301f; --warn: #f0ad4e; --warn-soft: #3a2a10; --bad: #ff7a7f; --bad-soft: #3d1517; --info: #7fa8ff; --info-soft: #18264a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
html, body { overflow-x: hidden; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
.tab { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
a { color: var(--primary); }

.demo-bar { background: var(--nav); color: #fff; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; }
.demo-bar .tag { background: var(--accent); color: #fff; border-radius: 999px; padding: 2px 9px; font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.demo-bar label { display: flex; align-items: center; gap: 8px; min-width: 0; }
.demo-bar select { background: #1d2c43; color: #fff; border: 1px solid #36506e; border-radius: 8px; padding: 6px 8px; max-width: 100%; min-width: 0; }
.demo-bar .sp { flex: 1; }
.demo-bar button { background: transparent; border: 1px solid #36506e; color: #dbe6f2; border-radius: 8px; padding: 5px 10px; cursor: pointer; }

.frame { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: calc(100vh - 44px); }
.side { background: var(--nav); color: var(--nav-fg); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; color: #fff; font-weight: 800; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: #0f1b2d; border: 1px solid #2b3d57; position: relative; flex: none; }
.logo::before { content: ""; position: absolute; left: 8px; top: 7px; width: 14px; height: 4px; border-radius: 2px; background: #00AEBF; }
.logo::after { content: ""; position: absolute; left: 8px; top: 14px; width: 9px; height: 4px; border-radius: 2px; background: #E0295A; }
.company { background: #16253a; border-radius: 10px; padding: 8px 10px; margin: 0 4px 10px; }
.company small { display: block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #8193a8; font-weight: 600; }
.company b { color: #fff; font-weight: 600; }
.navbtn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; color: var(--nav-fg); padding: 9px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.navbtn:hover { background: #16253a; color: #fff; }
.navbtn[aria-current="page"] { background: #1c3048; color: #fff; box-shadow: inset 3px 0 0 #00AEBF; }
.navbtn .count { margin-left: auto; background: var(--accent); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 7px; font-weight: 700; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); height: 56px; display: flex; align-items: center; gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top .who { margin-left: auto; text-align: right; line-height: 1.2; }
.top .who small { color: var(--fg-2); display: block; }
.bell { position: relative; width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; display: grid; place-items: center; }
.bell span { position: absolute; top: -3px; right: -3px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; border-radius: 999px; min-width: 17px; height: 17px; display: grid; place-items: center; padding: 0 4px; }
.content { padding-block: 22px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1180px; width: 100%; display: grid; gap: 20px; align-content: start; }
.bottom { display: none; }

.page-h { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; justify-content: space-between; }
.page-h h1 { font-size: 24px; }
.page-h p { margin: 2px 0 0; color: var(--fg-2); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; min-width: 0; }
.card h2 { font-size: 16px; margin-bottom: 4px; }
.card .sub { color: var(--fg-2); margin: 0 0 12px; font-size: 13px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; cursor: pointer; text-align: left; }
.kpi b { display: block; font-size: 26px; line-height: 1.2; }
.kpi span { color: var(--fg-2); font-size: 13px; }
.kpi.alert b { color: var(--bad); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; border: 1px solid transparent; padding: 9px 14px; font-weight: 600; cursor: pointer; background: var(--primary); color: #fff; }
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.lg { padding: 12px 18px; font-size: 15px; }
.btn.out { background: var(--surface); color: var(--fg); border-color: var(--border); }
.btn.ghost { background: transparent; color: var(--primary); padding: 6px 8px; }
.content > .btn.ghost { justify-self: start; margin-bottom: -10px; }
.btn.danger { background: var(--bad); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--muted); color: var(--fg-2); }
.b-info { background: var(--info-soft); color: var(--info); } .b-ok { background: var(--ok-soft); color: var(--ok); } .b-warn { background: var(--warn-soft); color: var(--warn); }
.b-bad { background: var(--bad-soft); color: var(--bad); } .b-brand { background: var(--primary-soft); color: var(--primary); }

.list { list-style: none; margin: 0; padding: 0; }
.list > li { border-top: 1px solid var(--border); padding: 12px 0; display: flex; gap: 12px; align-items: center; }
.list > li:first-child { border-top: 0; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--fg-2); }
.small { font-size: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { font-size: 12px; color: var(--fg-2); font-weight: 600; background: var(--muted); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--muted); }
.tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }

.action-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { border: 0; border-radius: 16px; padding: 18px; text-align: left; cursor: pointer; color: #fff; display: grid; gap: 6px; }
.tile b { font-size: 18px; } .tile span { opacity: .85; font-size: 13px; }
.tile.t1 { background: var(--primary); } .tile.t2 { background: #2c3e57; } .tile.t3 { background: var(--accent); }

.item-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.thumb { aspect-ratio: 4/3; border-radius: 10px; background: var(--muted); display: grid; place-items: center; overflow: hidden; margin-bottom: 10px; max-width: 100%; }
.sheet { width: 54%; aspect-ratio: 3/4; background: #fff; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.18); padding: 9% 8%; display: grid; gap: 7%; align-content: start; }
.sheet i { display: block; height: 9px; border-radius: 3px; }
.sheet i:nth-child(1) { background: #00AEBF; width: 80%; } .sheet i:nth-child(2) { background: #E0295A; width: 55%; } .sheet i:nth-child(3), .sheet i:nth-child(4) { background: #c9d2dc; height: 4px; }

.choice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 12px 14px; text-align: left; cursor: pointer; }
.opt b { display: block; } .opt span { color: var(--fg-2); font-size: 12px; }
.opt[aria-pressed="true"], .opt[aria-checked="true"] { border-color: var(--primary); background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips .opt { min-width: 130px; }

label.f { display: grid; gap: 4px; font-weight: 500; font-size: 13px; }
input[type=text], input[type=date], input[type=number], select.in, textarea { width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 9px 11px; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }

.price-box { border: 1px solid color-mix(in srgb, var(--primary) 45%, var(--border)); }
.big { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }

.progress { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; }
.progress li { list-style: none; display: grid; justify-items: center; gap: 6px; text-align: center; font-size: 12px; color: var(--fg-2); }
.progress .dot { width: 28px; height: 28px; border-radius: 999px; border: 2px solid var(--border); background: var(--surface); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.progress .done .dot { background: var(--primary); border-color: var(--primary); color: #fff; }
.progress .now .dot { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
.progress .now { color: var(--fg); font-weight: 600; }
.progress ol { display: contents; }

.timeline { list-style: none; margin: 0; padding: 0 0 0 22px; border-left: 2px solid var(--border); display: grid; gap: 16px; }
.timeline li { position: relative; }
.timeline li::before { content: ""; position: absolute; left: -29px; top: 3px; width: 12px; height: 12px; border-radius: 999px; background: var(--border); border: 2px solid var(--surface); }
.timeline li:first-child::before { background: var(--primary); }
.timeline b { display: block; }

dl.money { margin: 0; display: grid; gap: 4px; }
dl.money div { display: flex; justify-content: space-between; gap: 12px; }
dl.money dt { color: var(--fg-2); } dl.money dd { margin: 0; }
dl.money .tot { border-top: 1px solid var(--border); padding-top: 6px; font-weight: 800; font-size: 16px; }
dl.money .tot dt { color: var(--fg); }

.notice { border-radius: 10px; padding: 10px 12px; }
.n-ok { background: var(--ok-soft); color: var(--ok); } .n-warn { background: var(--warn-soft); color: var(--warn); } .n-info { background: var(--info-soft); color: var(--info); } .n-bad { background: var(--bad-soft); color: var(--bad); }

.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 30; max-width: calc(100% - 32px); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--surface); border-left: 1px solid var(--border); z-index: 25; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px 16px; overflow-y: auto; box-shadow: -8px 0 24px rgba(0,0,0,.15); }
.scrim { position: fixed; inset: 0; background: rgba(8,16,26,.4); z-index: 24; }

@media (max-width: 900px) {
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .frame { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .bottom { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .bottom button { background: none; border: 0; padding: 9px 2px 8px; font-size: 11px; color: var(--fg-2); display: grid; justify-items: center; gap: 2px; cursor: pointer; }
  .bottom button[aria-current="page"] { color: var(--primary); font-weight: 700; }
  .bottom svg { width: 22px; height: 22px; }
  .action-tiles, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .fgrid, .choice { grid-template-columns: minmax(0, 1fr); }
  .hide-sm { display: none; }
  .demo-bar { gap: 6px 10px; }
  .demo-bar .sp { display: none; }
  .demo-bar label { flex: 1; }
  .demo-bar label select { flex: 1; width: 100%; }
  .top .who small { display: none; }
}
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .2s ease-out; } @keyframes up { from { transform: translate(-50%, 8px); opacity: 0; } } }
</style>
</head>
<body>
<div class="demo-bar" role="region" aria-label="Demo controls">
  <span class="tag">Demo</span>
  <span class="hide-sm">Pretend data in your browser. Nothing is real or sent anywhere.</span>
  <span class="sp"></span>
  <label for="who">Viewing as
    <select id="who">
      <option value="buyer">Client buyer (Liza)</option>
      <option value="viewer">Client viewer (Paolo)</option>
      <option value="sales">PA sales (Ana)</option>
      <option value="production">PA production (Jun)</option>
    </select>
  </label>
  <button type="button" id="reset">Reset demo</button>
</div>
<div class="frame">
  <nav class="side" aria-label="Main" id="side"></nav>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<nav class="bottom" aria-label="Main" id="bottom"></nav>
<div id="overlay"></div>

<script>
"use strict";
/* ============================================================= pretend database */
const STORE_KEY = "pa-orders-demo-v1";
const VAT = 0.12, ROUND_STEP = 5, MAX_AGE_YEARS = 3, MAX_ADJ = 20, VALID_DAYS = 15;

const STAGES = [["Submitted", ["submitted"]], ["Confirmed", ["confirmed", "prepress", "waiting_for_client_approval", "approved_for_print"]],
  ["In production", ["printing", "finishing", "quality_check"]], ["Ready / on the way", ["ready_for_pickup", "out_for_delivery"]], ["Delivered", ["delivered", "closed"]]];

    ],
    quoteRequests: [],
    notes: { buyer: [], viewer: [], sales: [{ t: "New order to confirm", b: "PA-2026-000203 · Business Cards – Ramon Garcia", at: d(0, 8), order: "o203", read: false }], production: [] },

/* ============================================================= instant quote engine (same rules as the real app) */
function inflationFactor(from, to) {
  const s = Date.parse(from + "T00:00:00Z"), e = Date.parse(to + "T00:00:00Z");
  let f = 1; const years = [];
  for (let y = new Date(s).getUTCFullYear(); y <= new Date(e).getUTCFullYear(); y++) {
    const ys = Math.max(s, Date.UTC(y, 0, 1)), ye = Math.min(e, Date.UTC(y + 1, 0, 1));
    const days = Math.round((ye - ys) / 864e5); if (days <= 0) continue;
    const known = Object.keys(INFLATION).map(Number).filter((k) => k <= y);
    const rate = INFLATION[y] ?? INFLATION[Math.max(...known)] ?? 0;
    const diy = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 366 : 365;
    f *= Math.pow(1 + rate / 100, days / diy); years.push({ y, rate, frac: days / diy });
  }
  return { f, years };
}
function quote(it, q) {
  const tier = it.tiers.find((t) => t.q === q);
  if (!tier) return { status: "blocked", reasons: ["quantity_not_in_tiers"] };
  const baseNet = tier.inc ? tier.total / 100 / (1 + VAT) : tier.total / 100;
  const age = (Date.parse(today()) - Date.parse(tier.date)) / 864e5 / 365.25;
  const { f } = inflationFactor(tier.date, today());
  const net = Math.max(baseNet, baseNet * f);
  const adj = (net / baseNet - 1) * 100;
  const gross = net * (1 + VAT);
  const totalC = Math.ceil(gross / ROUND_STEP - 1e-9) * ROUND_STEP * 100;
  const reasons = []; if (age > MAX_AGE_YEARS) reasons.push("estimate_too_old"); if (adj > MAX_ADJ) reasons.push("adjustment_over_limit");
  const valid = new Date(Date.parse(today()) + VALID_DAYS * 864e5).toISOString().slice(0, 10);
  return { status: reasons.length ? "blocked" : "offered", reasons, total: totalC, vat: vatOf(totalC), unit: totalC / 100 / q, adj, base: tier, valid };
}
const WHY = { estimate_too_old: "our last price for this quantity is over 3 years old, so we'll re-check it", adjustment_over_limit: "costs changed more than usual since your last order",
  quantity_not_in_tiers: "this quantity hasn't been priced before", specs_changed: "the specs differ from the last price we gave" };

  return `${o.status === "on_hold" ? `<div class="notice n-bad">On hold. Your account manager will contact you.</div>` : ""}
  <ol class="progress" aria-label="Order progress">${STAGES.map(([l], i) => { const done = cur > i || (cur === i && i === 4); const now = cur === i && !done;

}

    ${sales ? `<button class="kpi ${unpaid.length ? "alert" : ""}" data-go="sorders"><b class="tab">${unpaid.length}</b><span>Unpaid or partly paid · ${peso(unpaid.reduce((s, o) => s + total(o) - paid(o), 0))} owed</span></button>
    <button class="kpi" data-go="qrs"><b class="tab">${qr.length}</b><span>Quote requests waiting</span></button>`
    : `<div class="kpi"><b class="tab">${db.orders.filter((o) => o.status === "out_for_delivery").length}</b><span>Out for delivery</span></div><div class="kpi"><b>—</b><span>Prices and payments hidden for production</span></div>`}
  </div>
  <section class="card"><h2>Work queue</h2><p class="sub">Oldest first.</p><ul class="list">
    ${[...toConfirm.map((o) => [o, sales ? "Confirm the order" : "Waiting for sales to confirm"]), ...prodNow.map((o) => [o, "Update the status"])].map(([o, what]) => `<li style="cursor:pointer" data-sorder="${o.id}"><div class="grow"><b>${o.no}</b> · ABC Corporation<div class="muted small">${esc(o.lines.map((l) => l.title).join(", "))}</div></div><span class="muted small hide-sm">${what}</span>${badge(o.status)}</li>`).join("") || '<li class="muted">All caught up.</li>'}
  </ul></section>`;
}
function vSOrders() {
  const rows = [...db.orders].sort((a, b) => b.placed.localeCompare(a.placed));
  return `<div class="page-h"><div><h1>Orders</h1><p>Confirm new orders, update their status and record payments.</p></div></div>
  <div class="tablewrap"><table><thead><tr><th>Order</th><th>Client</th><th class="hide-sm">Items</th><th>Placed</th><th>Status</th>${me === "sales" ? "<th>Total</th>" : ""}</tr></thead><tbody>
  ${rows.map((o) => `<tr class="click" data-sorder="${o.id}"><td><b>${o.no}</b></td><td>ABC Corporation</td><td class="hide-sm">${esc(o.lines.map((l) => l.title).join(", "))}</td><td>${fdate(o.placed)}</td><td>${badge(o.status)}</td>${me === "sales" ? `<td class="tab">${peso(total(o))}<br>${payBadge(o)}</td>` : ""}</tr>`).join("")}
  </tbody></table></div>`;
}
function allowed(from) {
  if (["cancelled", "closed"].includes(from)) return [];
  if (from === "delivered") return ["closed"];
  if (from === "submitted") return ["on_hold"];
  return ["prepress", "waiting_for_client_approval", "approved_for_print", "printing", "finishing", "quality_check", "ready_for_pickup", "out_for_delivery", "delivered", "closed", "on_hold"].filter((s) => s !== from);
}
function nextOf(from) { const i = FLOW.indexOf(from); const n = i >= 0 ? FLOW[i + 1] : null; const a = allowed(from); return n && a.includes(n) ? n : from === "quality_check" ? "out_for_delivery" : a[0]; }
function payForm(o) {
  const bal = Math.max(0, total(o) - paid(o));
  ui.method ??= "Bank transfer";
  return `<details style="margin-top:12px;border:1px solid var(--border);border-radius:10px;padding:10px 12px" ${bal > 0 ? "open" : ""}><summary><b>Record a payment</b></summary>
  <div class="fgrid" style="margin-top:10px"><div class="row" role="radiogroup" aria-label="Method" style="grid-column:1/-1">${["Bank transfer", "Cheque"].map((m) => `<button class="opt" role="radio" data-method="${m}" aria-checked="${ui.method === m}" style="padding:6px 12px">${m}</button>`).join("")}</div>
  <label class="f" for="pref">${ui.method === "Cheque" ? "Cheque number" : "Reference number"}<input type="text" id="pref"></label>
  <label class="f" for="pbank">Bank<input type="text" id="pbank" placeholder="BDO, BPI, Metrobank…"></label>
  <label class="f" for="pamt">Amount ₱<input type="text" id="pamt" inputmode="decimal" value="${(bal / 100).toFixed(2)}"></label>
  <label class="f" for="pdate">Date received<input type="date" id="pdate" value="${today()}" max="${today()}"></label></div>
  <button class="btn" id="recordPay" style="margin-top:10px">Record payment</button></details>`;
}
function vSOrder() {
  const o = order(view.id); const sales = me === "sales"; const opts = allowed(o.status);
  ui.to ??= nextOf(o.status); ui.visible ??= true;
  return `<button class="btn ghost" data-go="sorders">‹ Orders</button>
  <div class="page-h"><div><h1>${o.no}</h1><p>ABC Corporation · ${o.kind} · placed ${ftime(o.placed)}${o.po ? ` · PO ${esc(o.po)}` : ""}</p></div><div class="row">${sales ? payBadge(o) : ""}${badge(o.status)}</div></div>
  <div class="grid2"><div style="display:grid;gap:20px;min-width:0">
    ${o.status === "submitted" && sales ? `<section class="card" style="border-color:var(--info)"><h2>Confirm this order</h2><p class="sub">Change a price only if needed. The client is told and sees the new total.</p>
      ${o.lines.map((l, i) => `<div class="row" style="border:1px solid var(--border);border-radius:10px;padding:10px 12px"><span class="grow"><b>${esc(l.title)}</b><br><span class="muted tab">${l.q} pcs · ${peso(l.total)}</span></span><label class="f" for="np${i}" style="width:150px">New total ₱ (optional)<input type="text" id="np${i}" inputmode="decimal" placeholder="${(l.total / 100).toFixed(2)}"></label></div>`).join("")}
      <label class="f" for="cnote" style="margin-top:10px">Note to the client (optional)<input type="text" id="cnote" placeholder="e.g. Rush fee added for the 3-day deadline"></label>
      <div class="row" style="margin-top:12px"><button class="btn" id="confirmOrder">Confirm order</button><button class="btn out" id="staffCancel">Cancel order</button></div></section>` : ""}
    ${o.status === "submitted" && !sales ? `<div class="notice n-info">Waiting for sales to confirm the price. Production can only put it On Hold.</div>` : ""}
    <section class="card"><h2>Items</h2><ul class="list">${o.lines.map((l) => `<li><div class="grow"><b>${esc(l.title)}</b><div class="muted tab">${l.q.toLocaleString("en-PH")} pcs</div></div>${sales ? `<b class="tab">${peso(l.total)}</b>` : ""}</li>`).join("")}</ul></section>
    <section class="card"><h2>Timeline</h2><p class="sub">Staff also see internal notes.</p>${timeline(o, true)}</section>
    ${["delivered", "closed"].includes(o.status) && sales && o.lines.some((l) => l.item) ? `<div class="card row" style="background:var(--primary-soft)"><span class="grow">Save this order's final prices as the items' <b>new agreed prices</b>, dated today? Future instant quotes start from them.</span><button class="btn" id="saveAgreed">Save as agreed prices</button></div>` : ""}
  </div><div style="display:grid;gap:20px;min-width:0">
    ${opts.length && !(o.status === "submitted" && sales) ? `<section class="card"><h2>Update status</h2><p class="sub">Now: <b>${STATUS[o.status][0]}</b>. You can skip steps.</p>
      <label class="f" for="to">New status<select class="in" id="to">${opts.map((s) => `<option value="${s}" ${s === ui.to ? "selected" : ""}>${STATUS[s][0]}</option>`).join("")}</select></label>
      <label class="f" for="snote" style="margin-top:10px">Note (optional)<textarea id="snote" rows="2" placeholder="${["delivered", "out_for_delivery"].includes(ui.to) ? "e.g. Truck left 8:40 AM, driver Jun" : "e.g. Lamination started"}"></textarea></label>
      <div class="switch" style="margin-top:10px"><span><b>Show this update to the client</b><br><span class="muted small">Off: an internal note only staff see.</span></span><input type="checkbox" id="vis" ${ui.visible ? "checked" : ""} aria-label="Show this update to the client" style="width:20px;height:20px"></div>
      <p class="muted small">In the real app you can also attach production or delivery photos and the signed delivery receipt here.</p>
      <button class="btn" id="updStatus">Update to ${STATUS[ui.to]?.[0] ?? ""}</button></section>` : ""}
    ${sales ? moneyCard(o, true) : `<div class="notice n-info small">Prices and payments are hidden for production.</div>`}
    <section class="card"><h2>Delivery</h2><p style="margin:0">${esc(o.address)}</p></section>
  </div></div>`;
}
function vQrs() {
  return `<div class="page-h"><div><h1>Quote requests</h1><p>Reorders that need a manual quote, with the reason and a suggested price.</p></div></div>
  <section class="card"><ul class="list">${db.quoteRequests.length ? db.quoteRequests.map((q) => `<li><div class="grow"><b>${q.no}</b> · ABC Corporation<div class="muted small">Reorder: ${esc(q.title)} · ${q.qty.toLocaleString("en-PH")} pcs · ${esc(q.reason)}</div>${q.suggested ? `<div class="small">Suggested price: <b>${peso(q.suggested)}</b></div>` : ""}</div><span class="badge b-warn">Needs quote</span></li>`).join("")
    : '<li class="muted">None yet. As the buyer, ask for a quote on 5,000 brochures (that price is over 3 years old) and it appears here.</li>'}</ul>
  <p class="muted small">In the real app you reply with prices per quantity, lead time and validity, and the client accepts in one tap.</p></section>`;
}

/* ============================================================= actions */
function addEvent(o, s, note, vis = true) { o.events.push([s, new Date().toISOString(), note || "", vis]); }
function placeReorder() {
  const it = item(view.id); const q = quote(it, ui.qty);
  const no = `PA-2026-${String(++db.seq.order).padStart(6, "0")}`; const id = "o" + db.seq.order;
  const o = { id, no, kind: "Reorder", status: "confirmed", placed: new Date().toISOString(), by: "buyer", po: $("#po")?.value ?? "", address: $("#addr")?.value ?? ui.addr,
    lines: [{ item: it.id, title: it.name, q: ui.qty, total: q.total }], payments: [], events: [] };
  addEvent(o, "submitted", ""); addEvent(o, "confirmed", "Instant reorder at today's price.");
  db.orders.push(o);
  notify(["sales"], `New reorder ${no}`, `${it.name} × ${ui.qty.toLocaleString("en-PH")} · ${peso(q.total)}`, id);
  notify(["production"], `New job ${no}`, `${it.name} × ${ui.qty.toLocaleString("en-PH")}`, id);
  save(); go("order", { id, placed: true }); toast("Order placed. Sales and production were notified (switch roles to see).");
}
function askQuote() {
  const it = item(view.id);
  const qty = ui.qty === "other" ? Number($("#otherq")?.value) : ui.qty;
  if (!qty || qty <= 0) return toast("Type the quantity you need.");
  const q = typeof ui.qty === "number" ? quote(it, ui.qty) : null;
  const reason = ui.qty === "other" ? "quantity not priced before" : ui.changes ? "specs changed" : (q?.reasons ?? []).map((r) => r.replace(/_/g, " ")).join(", ");
  const no = `QR-2026-${String(++db.seq.qr).padStart(4, "0")}`;
  db.quoteRequests.unshift({ no, title: it.name, qty, reason, suggested: q?.total ?? null, status: "open" });
  notify(["sales"], `New quote request ${no}`, `${it.name} × ${qty.toLocaleString("en-PH")} (${reason})`, null);
  save(); go("home"); toast(`Quote request ${no} sent. Ana in sales was notified.`);
}
function updateStatus() {
  const o = order(view.id); const to = $("#to").value; const note = $("#snote").value.trim(); const vis = $("#vis").checked;
  const from = o.status; o.status = to; addEvent(o, to, note, vis);
  if (vis) notify(["buyer", "viewer"], `${o.no}: ${STATUS[to][0]}`, note || (EMAILED.has(to) ? "We also sent you an email." : ""), o.id);
  if (from !== to && me === "production") notify(["sales"], `${o.no}: ${STATUS[to][0]}`, `Updated by ${U().name}`, o.id);
  save(); ui = {}; render(); toast(`Status changed to ${STATUS[to][0]}.${vis ? " The client was notified" + (EMAILED.has(to) ? " (in-app + email)." : " (in-app).") : " Internal note only."}`);
}
function parsePeso(v) { const n = Number(String(v).replace(/[₱,\s]/g, "")); return Number.isFinite(n) && n > 0 ? Math.round(n * 100) : null; }
function confirmOrder() {
  const o = order(view.id); let changed = false;
  o.lines.forEach((l, i) => { const v = $("#np" + i)?.value; if (v && v.trim()) { const c = parsePeso(v); if (c) { l.total = c; changed = true; } } });
  const note = $("#cnote").value.trim() || (changed ? "Confirmed with an updated price." : "");
  o.status = "confirmed"; addEvent(o, "confirmed", note);
  notify(["buyer"], `Order ${o.no} confirmed`, changed ? "The price was updated. Please check the new total." : "", o.id);
  notify(["production"], `New job ${o.no}`, o.lines.map((l) => l.title).join(", "), o.id);
  save(); ui = {}; render(); toast("Order confirmed. The client was notified.");
}
function recordPay() {
  const o = order(view.id); const ref = $("#pref").value.trim(); const amt = parsePeso($("#pamt").value); const on = $("#pdate").value;
  if (!ref) return toast(ui.method === "Cheque" ? "Enter the cheque number." : "Enter the bank reference number.");
  if (!amt) return toast("Enter the amount received.");
  if (!on || on > today()) return toast("Enter the date received (not in the future).");
  o.payments.push({ method: ui.method, ref, bank: $("#pbank").value.trim(), amount: amt, on });
  const st = payStatus(o);
  notify(["buyer"], `Payment received for ${o.no}`, st === "paid" ? "Your order is fully paid. Thank you!" : `Balance ${peso(total(o) - paid(o))}`, o.id);
  save(); ui = {}; render(); toast(`Payment recorded. The order is now ${st === "paid" ? "Paid" : "Partially Paid"}.`);
}
function cancel(staff) {
  const o = order(view.id);
  ui.cancel = true; overlay(`<h2>Cancel ${o.no}?</h2><p class="muted">${staff ? "The client is told, with your reason." : "Print Amplified is told, with your reason. You can place a new order any time."}</p>
    <label class="f" for="creason">Reason<textarea id="creason" rows="3"></textarea></label><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn out" data-close>Keep order</button><button class="btn danger" id="doCancel">Cancel order</button></div>`,
  () => { $("#doCancel").onclick = () => { const r = $("#creason").value.trim(); if (r.length < 3) return toast("Please give a reason.");
    o.status = "cancelled"; addEvent(o, "cancelled", r); notify(staff ? ["buyer"] : ["sales"], `Order ${o.no} cancelled${staff ? "" : " by the client"}`, r, o.id); save(); closeOverlay(); ui = {}; render(); toast("Order cancelled."); }; });
}
function overlay(html, after) { $("#overlay").innerHTML = `<div class="scrim" data-close></div><div class="drawer" role="dialog" aria-modal="true">${html}</div>`; after?.(); $("#overlay .drawer button, #overlay .drawer textarea")?.focus(); }
function closeOverlay() { $("#overlay").innerHTML = ""; }
function showNotes() {
  const list = db.notes[me];
  overlay(`<div class="row" style="justify-content:space-between"><h2>Notifications</h2><button class="btn ghost" data-close>Close</button></div>
  <p class="muted small">On an installed phone these also arrive as push notifications.</p>
  <ul class="list">${list.length ? list.map((n, i) => `<li style="cursor:pointer;align-items:flex-start" data-note="${i}"><span style="width:8px;height:8px;border-radius:9px;margin-top:7px;background:${n.read ? "transparent" : "var(--accent)"}"></span><div class="grow"><b>${esc(n.t)}</b>${n.b ? `<div class="small">${esc(n.b)}</div>` : ""}<div class="muted small">${ftime(n.at)}</div></div></li>`).join("") : '<li class="muted">Nothing yet. Place or update an order, then switch roles.</li>'}</ul>`);
  list.forEach((n) => (n.read = true)); save(); renderChrome();
}

/* ============================================================= render + events */
function render() {
  const allowedViews = isClient() ? ["home", "items", "item", "reorder", "orders", "order"] : ["dash", "sorders", "sorder", "qrs"];
  if (!allowedViews.includes(view.name) || (view.name === "reorder" && !canOrder()) || (view.name === "qrs" && me !== "sales")) view = { name: isClient() ? "home" : "dash" };
  renderChrome();
  const V = { home: vHome, items: vItems, item: vItem, reorder: vReorder, orders: vOrders, order: vOrder, dash: vDash, sorders: vSOrders, sorder: vSOrder, qrs: vQrs };
  $("#view").innerHTML = V[view.name]();
  $("#who").value = me;
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-open], [data-sorder], [data-note], [data-close], tr");
  if (!t) return;
  const d = t.dataset;
  if (d.close !== undefined) return closeOverlay();
  if (d.go) return go(d.go);
  if (d.toast) return toast(d.toast);
  if (d.open) return go("order", { id: d.open });
  if (d.sorder) return go("sorder", { id: d.sorder });
  if (d.item) return go("item", { id: d.item });
  if (d.reorder) return go("reorder", { id: d.reorder });
  if (d.note !== undefined) { const n = db.notes[me][+d.note]; closeOverlay(); if (n?.order) go(isClient() ? "order" : "sorder", { id: n.order }); return; }
  if (d.art) { ui.art = d.art === "yes"; return render(); }
  if (d.qty) { ui.qty = d.qty === "other" ? "other" : Number(d.qty); return render(); }
  if (d.method) { ui.method = d.method; return render(); }
  switch (t.id) {
    case "bell": return showNotes();
    case "placeNow": return placeReorder();
    case "askQuote": return askQuote();
    case "updStatus": return updateStatus();
    case "confirmOrder": return confirmOrder();
    case "recordPay": return recordPay();
    case "cancelOrder": return cancel(false);
    case "staffCancel": return cancel(true);
    case "saveAgreed": { const o = order(view.id); for (const l of o.lines) { const it = item(l.item); if (!it) continue; it.tiers = it.tiers.filter((x) => x.q !== l.q).concat({ q: l.q, total: l.total, date: today(), inc: true, ref: o.no }).sort((a, b) => a.q - b.q); } save(); return toast("Saved. The next instant reorder of this item starts from this price, dated today."); }
    case "same": { const it = item(view.id); const last = db.orders.filter((o) => o.lines.some((l) => l.item === it.id)).sort((a, b) => b.placed.localeCompare(a.placed))[0]; ui.art = true; ui.qty = last.lines[0].q; ui.addr = last.address.startsWith("Warehouse") ? "Warehouse – Laguna, Cabuyao" : "Head office, Makati City"; if (!it.tiers.some((x) => x.q === ui.qty)) { ui.other = ui.qty; ui.qty = "other"; } return render(); }
  }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "who") { me = e.target.value; save(); go(isClient() ? "home" : "dash"); toast(`Now viewing as ${U().name} (${U().label}).`); }
  if (e.target.id === "chg") { ui.changes = e.target.checked; render(); }
  if (e.target.id === "addr") ui.addr = e.target.value;
  if (e.target.id === "to") { ui.to = e.target.value; const b = $("#updStatus"); if (b) b.textContent = `Update to ${STATUS[ui.to][0]}`; }
  if (e.target.id === "vis") ui.visible = e.target.checked;
});
document.addEventListener("input", (e) => { if (e.target.id === "otherq") ui.other = e.target.value; if (e.target.id === "po") ui.po = e.target.value; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeOverlay(); });
$("#reset").onclick = () => { db = seed(); me = "buyer"; save(); go("home"); toast("Demo reset to the starting data."); };

load(); view = { name: isClient() ? "home" : "dash" }; render();
</script>
</body>
</html>
